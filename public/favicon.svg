  <!-- Small CO2 bubbles (top-left corner) -->
  <circle cx="6" cy="7" r="1.5" fill="white" opacity="0.55"/>
  <circle cx="10" cy="5" r="1" fill="white" opacity="0.4"/>
  <circle cx="7" cy="3.5" r="0.8" fill="white" opacity="0.3"/>
